<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Global Consensus 2026</title>
    <style>
        :root { --accent: #6C5DD3; --bg: #0a0a0b; --card: #16161a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: var(--accent); font-size: 2.5rem; margin-bottom: 5px; }
        .stat-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; font-size: 0.9rem; color: #888; }
        
        .controls { background: var(--card); padding: 20px; border-radius: 15px; display: flex; gap: 10px; margin-bottom: 30px; border: 1px solid #222; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; font-size: 1rem; }
        button { background: var(--accent); color: white; padding: 0 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; cursor: not-allowed; }

        #container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; border-top: 4px solid #444; animation: pop 0.3s ease-out; }
        .card.success { border-top-color: #00ff88; }
        .card.fail { border-top-color: #ff4444; opacity: 0.6; }
        
        .m-name { font-size: 0.75rem; font-weight: 800; color: var(--accent); display: block; margin-bottom: 8px; text-transform: uppercase; }
        .card p { margin: 0; line-height: 1.4; font-size: 0.95rem; }
        
        #status { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); font-weight: bold; z-index: 100; display: none; }

        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <h1>Global AI Consensus</h1>
    <div class="stat-bar">
        <span>Models Discovered: <b id="count">0</b></span>
        <span>Successful Responses: <b id="success">0</b></span>
    </div>

    <div class="controls">
        <input type="text" id="topic" placeholder="Who is the GOAT? / Best Programming Language? / Is AI sentient?">
        <button id="runBtn" onclick="startBattle()">POLL ALL MODELS</button>
    </div>

    <div id="container"></div>
    <div id="status">Scanning...</div>

    <script>
        const API_KEY = "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";
        
        async function startBattle() {
            const topic = document.getElementById("topic").value;
            if(!topic) return;

            const container = document.getElementById("container");
            const runBtn = document.getElementById("runBtn");
            const status = document.getElementById("status");
            
            container.innerHTML = "";
            runBtn.disabled = true;
            status.style.display = "block";

            try {
                // 1. DYNAMICALLY GET ALL FREE MODELS
                status.innerText = "Discovering Free Models...";
                const modelRes = await fetch("https://openrouter.ai/api/v1/models");
                const modelData = await modelRes.json();
                
                // Filter for "free" and "chat/text" capable models
                const freeModels = modelData.data.filter(m => 
                    m.id.includes(":free") && 
                    !m.id.includes("image") && 
                    !m.id.includes("vision")
                );

                document.getElementById("count").innerText = freeModels.length;
                let successCount = 0;

                // 2. RUN THEM IN SMALL BATCHES (to avoid browser crashing/rate limits)
                for (let i = 0; i < freeModels.length; i++) {
                    const model = freeModels[i];
                    status.innerText = `Polling (${i+1}/${freeModels.length}): ${model.name || model.id}`;

                    const prompt = `Topic: ${topic}. Answer in exactly 1-2 sentences. You MUST pick a side clearly. No neutrality.`;

                    // Run the fetch
                    fetchOpinion(model.id, model.name || model.id, prompt).then(res => {
                        if(res) {
                            successCount++;
                            document.getElementById("success").innerText = successCount;
                        }
                    });

                    // Wait 500ms between starting each request to keep the UI smooth
                    await new Promise(r => setTimeout(r, 500));
                }

            } catch (e) {
                alert("Error fetching model list: " + e.message);
            }

            status.innerText = "Complete!";
            setTimeout(() => status.style.display = "none", 3000);
            runBtn.disabled = false;
        }

        async function fetchOpinion(modelId, shortName, prompt) {
            const card = createCard(shortName);
            
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "http://localhost",
                        "X-Title": "ConsensusEngine"
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: [{role: "user", content: prompt}],
                        max_tokens: 100,
                        temperature: 0.9
                    })
                });

                const data = await res.json();
                if (data.choices && data.choices[0]) {
                    card.className = "card success";
                    card.querySelector("p").innerText = data.choices[0].message.content;
                    return true;
                } else {
                    throw new Error("Empty Response");
                }
            } catch (err) {
                card.className = "card fail";
                card.querySelector("p").innerText = "Model was busy or timed out.";
                return false;
            }
        }

        function createCard(name) {
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `<span class="m-name">${name.replace(':free','')}</span><p>Thinking...</p>`;
            document.getElementById("container").appendChild(div);
            return div;
        }
    </script>
</body>
</html>
